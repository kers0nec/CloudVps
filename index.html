<!DOCTYPE html>
<html>
<head>
    <title>Free VPS Generator</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
        body { background: #0b0f19; color: #f9fafb; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 500px; width: 100%; padding: 2rem; background: #111827; border-radius: 16px; border: 1px solid #1f2937; }
        h1 { text-align: center; margin-bottom: 0.5rem; color: #3b82f6; }
        p { text-align: center; color: #9ca3af; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; color: #9ca3af; }
        input { width: 100%; padding: 0.7rem; border-radius: 8px; border: 1px solid #1f2937; background: #0b0f19; color: #f9fafb; }
        .btn { width: 100%; padding: 0.7rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: transparent; border: 1px solid #1f2937; color: #f9fafb; margin-top: 0.5rem; }
        .toggle { text-align: center; margin-top: 1rem; color: #9ca3af; cursor: pointer; }
        .toggle:hover { color: #f9fafb; }
        .hidden { display: none; }
        .flash { padding: 0.7rem; border-radius: 8px; margin-bottom: 1rem; }
        .flash-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
        .flash-success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #22c55e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Free VPS Generator</h1>
        <p>Create your own free VPS in seconds</p>
        
        <div id="flash"></div>
        
        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        
        <!-- Register Form -->
        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="registerUsername" placeholder="Choose username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Choose password" required>
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
        
        <div class="toggle" id="toggleForm">Don't have an account? Register</div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const toggle = document.getElementById('toggleForm');
        const flash = document.getElementById('flash');
        let isLogin = true;

        toggle.addEventListener('click', () => {
            isLogin = !isLogin;
            loginForm.classList.toggle('hidden');
            registerForm.classList.toggle('hidden');
            toggle.textContent = isLogin ? "Don't have an account? Register" : "Already have an account? Login";
        });

        function showFlash(message, type) {
            flash.innerHTML = `<div class="flash flash-${type}">${message}</div>`;
            setTimeout(() => flash.innerHTML = '', 5000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${username}&password=${password}`
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    showFlash(data.error || 'Login failed', 'error');
                }
            } catch(e) {
                showFlash('Network error', 'error');
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            
            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${username}&password=${password}`
                });
                const data = await res.json();
                if (data.success) {
                    showFlash('Account created! Please login.', 'success');
                    toggle.click();
                } else {
                    showFlash(data.error || 'Registration failed', 'error');
                }
            } catch(e) {
                showFlash('Network error', 'error');
            }
        });
    </script>
</body>
</html>
